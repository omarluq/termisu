name: Build FFI Library
description: Build the native libtermisu shared library for CI jobs
runs:
  using: composite
  steps:
    - name: Build native FFI library
      shell: bash
      run: |
        mkdir -p bin
        CRYSTAL_LIB_PATHS="$(crystal env CRYSTAL_LIBRARY_PATH)"
        LIB_FLAGS=()
        IFS=':' read -r -a CRYSTAL_LIB_DIRS <<< "$CRYSTAL_LIB_PATHS"
        for lib_dir in "${CRYSTAL_LIB_DIRS[@]}"; do
          if [[ -n "$lib_dir" ]]; then
            LIB_FLAGS+=("-L${lib_dir}")
          fi
        done
        # -Dwithout_mt: an embedded runtime must not start the multi-threaded
        # execution-context scheduler (Crystal >= 1.21 default); its SYSMON
        # thread crashes inside foreign hosts (Bun, etc.).
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          crystal build src/termisu_ffi.cr --release --cross-compile -Dwithout_mt -o bin/libtermisu
          cc -shared bin/libtermisu.o -o bin/libtermisu.so "${LIB_FLAGS[@]}" -lgc -lpthread -ldl
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          crystal build src/termisu_ffi.cr --release --cross-compile -Dwithout_mt \
            --link-flags "$SDKROOT/usr/lib/libiconv.tbd" \
            -o bin/libtermisu
          cc -dynamiclib bin/libtermisu.o -o bin/libtermisu.dylib \
            -Wl,-install_name,@rpath/libtermisu.dylib \
            "${LIB_FLAGS[@]}" -lgc -lpthread \
            "$SDKROOT/usr/lib/libiconv.tbd"
        else
          echo "Unsupported RUNNER_OS: $RUNNER_OS"
          exit 1
        fi
