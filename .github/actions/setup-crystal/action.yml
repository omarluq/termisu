name: Setup Crystal
description: Install Crystal, cache shards, and install dependencies
inputs:
  crystal-version:
    description: Crystal version to install
    required: false
    default: 1.20.0
  install-shards:
    description: Whether to run shards install
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install Crystal
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ inputs.crystal-version }}
    - name: Cache Crystal shards
      if: inputs.install-shards == 'true'
      uses: actions/cache@v6
      with:
        path: |
          lib
          ~/.cache/crystal
        # shard.lock is gitignored, so hashing it yielded an empty digest: one
        # constant key per OS, shared across every Crystal version and blind to
        # dependency changes. That cached a lib/ built by one compiler for all
        # the others and hid a dependency break for days until the cache expired.
        # Hash the tracked manifest and scope the key to the compiler instead.
        key: ${{ runner.os }}-crystal-${{ inputs.crystal-version }}-shards-${{ hashFiles('shard.yml') }}
        restore-keys: |
          ${{ runner.os }}-crystal-${{ inputs.crystal-version }}-shards-
    - name: Install shards dependencies
      if: inputs.install-shards == 'true'
      shell: bash
      run: shards install
