name: E2E Tests
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - "src/**/*.cr"
      - "examples/**/*.cr"
      - "spec/e2e/**"
      - "spec/termisu/testing/**"
      - "shard.yml"
      - "shard.lock"
      - "Hacefile.yml"
      - ".github/workflows/e2e.yml"
      - ".github/actions/setup-crystal/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**/*.cr"
      - "examples/**/*.cr"
      - "spec/e2e/**"
      - "spec/termisu/testing/**"
      - "shard.yml"
      - "shard.lock"
      - "Hacefile.yml"
      - ".github/workflows/e2e.yml"
      - ".github/actions/setup-crystal/**"
  workflow_dispatch:
# The E2E suite is pure Crystal (Termisu::Testing): it drives the example
# binaries through a real PTY and asserts on the rendered screen. No
# node/bun/tui-test, so it runs identically on Linux, macOS, and FreeBSD.
# A Termisu app opens /dev/tty directly and sets its own raw mode, so the
# launching shell is irrelevant; the meaningful axis is the OS (termios /
# /dev/tty / terminfo), not the shell.
jobs:
  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Crystal
        uses: ./.github/actions/setup-crystal
        with:
          crystal-version: "1.21.0"
      - name: Install shards
        run: shards install
      - name: Build hace
        run: shards build hace
      - name: Run E2E suite
        run: bin/hace e2e
        env:
          TERMISU_LOG_LEVEL: debug
          TERMISU_LOG_SYNC: "true"
          TERMISU_LOG_FILE: ${{ runner.temp }}/termisu-e2e.log
      - name: Preserve E2E failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/termisu-e2e.log
          if-no-files-found: warn
          retention-days: 7
  e2e-freebsd:
    name: E2E (FreeBSD 15.0)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache FreeBSD shards
        uses: actions/cache@v6
        with:
          path: lib
          key: freebsd-e2e-${{ hashFiles('shard.yml', 'shard.lock') }}
          restore-keys: |
            freebsd-e2e-
      - name: Prepare FreeBSD E2E VM
        uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3 # v1.5.7
        with:
          release: "15.0"
          usesh: true
          sync: rsync
          prepare: |
            pkg install -y crystal shards terminfo-db
          run: |
            set -eux
            export TERM=xterm-256color
            crystal --version
            shards --version
            shards install
            shards build hace
      - name: Run FreeBSD E2E suite
        # This wrapper copies logs back even if the test command fails.
        shell: freebsd {0}
        run: |
          set -eux
          export TERM=xterm-256color
          export TERMISU_LOG_LEVEL=debug
          export TERMISU_LOG_SYNC=true
          export TERMISU_LOG_FILE="$PWD/termisu-e2e-freebsd.log"
          bin/hace e2e
      - name: Preserve FreeBSD E2E failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-freebsd
          path: termisu-e2e-freebsd.log
          if-no-files-found: warn
          retention-days: 7
