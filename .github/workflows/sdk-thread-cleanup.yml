name: SDK thread cleanup diagnostic
on:
  push:
    branches: [diagnostic/crystal122-thread-cleanup]
    paths:
      - ".github/scripts/sdk-thread-cleanup.cr"
      - ".github/workflows/sdk-thread-cleanup.yml"
permissions:
  contents: read
jobs:
  native-diagnostic:
    name: Native SDK cleanup (Crystal ${{ matrix.crystal }})
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        crystal: ["1.21.0", "1.22.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Crystal
        uses: ./.github/actions/setup-crystal
        with:
          crystal-version: ${{ matrix.crystal }}
          install-shards: "false"
      - name: Build SDK-only diagnostic
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          crystal --version
          crystal build .github/scripts/sdk-thread-cleanup.cr -o bin/sdk-thread-cleanup.exe --error-on-warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute bounded native diagnostic
        shell: pwsh
        run: |
          ./.github/scripts/windows-console-probe.ps1 -ProbePath bin/sdk-thread-cleanup.exe -OutputDirectory "$env:RUNNER_TEMP/sdk-thread-cleanup"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-thread-cleanup-${{ matrix.crystal }}
          path: ${{ runner.temp }}/sdk-thread-cleanup
          if-no-files-found: error
          retention-days: 7
